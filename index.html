<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver POC</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
      #app { width: 100vw; height: 100vh; }
      canvas { display: block; }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 6px;
        line-height: 1.5;
        pointer-events: none;
        z-index: 10;
      }

      #gauges {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 16px;
        z-index: 10;
        pointer-events: none;
        font-family: monospace;
        color: #fff;
      }
      #terrain-stats {
        position: fixed;
        top: 10px;
        right: 10px;
        color: #fff;
        font-family: monospace;
        font-size: 11px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 6px;
        line-height: 1.4;
        pointer-events: none;
        z-index: 10;
      }
      #terrain-stats .ts-text {
        white-space: pre;
        margin-bottom: 6px;
      }
      #terrain-stats .ts-compass-wrap {
        display: grid;
        grid-template-columns: 12px max-content 12px;
        grid-template-rows: 12px max-content 12px;
        gap: 3px;
        align-items: center;
        justify-items: center;
      }
      #terrain-stats .ts-dir {
        opacity: 0.6;
        font-size: 10px;
      }
      #terrain-stats .ts-dir.n { grid-column: 2; grid-row: 1; }
      #terrain-stats .ts-dir.s { grid-column: 2; grid-row: 3; }
      #terrain-stats .ts-dir.w { grid-column: 1; grid-row: 2; }
      #terrain-stats .ts-dir.e { grid-column: 3; grid-row: 2; }
      #terrain-stats .ts-grid {
        grid-column: 2;
        grid-row: 2;
        display: grid;
        gap: 1px;
      }
      #terrain-stats .ts-cell {
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        border-radius: 2px;
        box-sizing: border-box;
      }
      #terrain-stats .ts-cell.loaded { background: rgba(76, 175, 80, 0.55); }
      #terrain-stats .ts-cell.pending { background: rgba(255, 193, 7, 0.6); color: #3a2a00; }
      #terrain-stats .ts-cell.removing { background: rgba(244, 67, 54, 0.45); }
      #terrain-stats .ts-cell.empty { background: rgba(255, 255, 255, 0.06); }
      #terrain-stats .ts-cell.player {
        background: #fff;
        color: #111;
        font-weight: bold;
        box-shadow: 0 0 4px #fff;
      }
      #terrain-stats .ts-cell.ahead { outline: 2px solid #4fc3ff; outline-offset: -1px; }
      #terrain-stats .ts-legend {
        margin-top: 6px;
        opacity: 0.85;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 10px;
      }
      #terrain-stats .ts-legend span.swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 3px;
        vertical-align: middle;
      }
      #address-search {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 11;
        display: flex;
        gap: 6px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #address-search input {
        width: 260px;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
      }
      #address-search input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }
      #address-search button {
        padding: 7px 14px;
        border-radius: 6px;
        border: none;
        background: #4fc3ff;
        color: #06222f;
        font-weight: 600;
        cursor: pointer;
      }
      #address-search button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #address-search-status {
        position: fixed;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 11;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 10px;
        border-radius: 5px;
        display: none;
      }
      #suspension-hud {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: #fff;
        font-family: monospace;
        font-size: 10px;
        background: rgba(0,0,0,0.5);
        padding: 8px 10px;
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }
      #suspension-hud .susp-title {
        margin-bottom: 6px;
        opacity: 0.8;
        letter-spacing: 0.5px;
      }
      #suspension-hud .susp-grid {
        display: grid;
        grid-template-columns: repeat(2, 34px);
        gap: 6px 16px;
      }
      #suspension-hud .susp-wheel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #suspension-hud .susp-bar {
        width: 14px;
        height: 60px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }
      #suspension-hud .susp-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: #4fc3ff;
      }
      #suspension-hud .susp-rest-line {
        position: absolute;
        left: -1px;
        right: -1px;
        top: 50%;
        height: 1px;
        background: rgba(255, 255, 255, 0.7);
        z-index: 1;
      }
      #suspension-hud .susp-label {
        opacity: 0.85;
        text-align: center;
      }
      .gauge {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.25);
        box-sizing: border-box;
      }
      .gauge-face {
        position: absolute;
        inset: 0;
      }
      .gauge-value {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        font-weight: bold;
        text-shadow: 0 0 4px #000;
      }
      .gauge-label {
        position: absolute;
        top: 66%;
        left: 50%;
        transform: translate(-50%, 0);
        font-size: 10px;
        opacity: 0.8;
      }
      /* Speedometer needle: pivots from the gauge center, pointing up at 0. */
      .gauge-needle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 3px;
        height: 48px;
        background: #ff3b3b;
        border-radius: 2px;
        transform-origin: 50% 100%;
        transform: translate(-50%, -100%) rotate(-90deg);
        transition: transform 0.08s linear;
      }
      /* Compass dial rotates under a fixed pointer at top. */
      .compass-face {
        transition: transform 0.08s linear;
      }
      .compass-face .dir {
        position: absolute;
        left: 50%;
        top: 50%;
        font-size: 13px;
        font-weight: bold;
      }
      .compass-face .dir.n { transform: translate(-50%, -50px); color: #ff5b5b; }
      .compass-face .dir.e { transform: translate(-50%, -50%) translateX(52px); }
      .compass-face .dir.s { transform: translate(-50%, 40px); }
      .compass-face .dir.w { transform: translate(-50%, -50%) translateX(-52px); }
      .compass-pointer {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 10px solid #fff;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <form id="address-search" autocomplete="off">
      <input id="address-input" type="text" placeholder="Search an address to respawn there\u2026" />
      <button id="address-submit" type="submit">Go</button>
    </form>
    <div id="address-search-status"></div>
    <div id="hud">
      W / &uarr; &mdash; throttle<br />
      S / &darr; &mdash; brake / reverse<br />
      A D / &larr; &rarr; &mdash; steer<br />
      Space &mdash; handbrake<br />
      R &mdash; reset car<br />
      M &mdash; toggle debug view
    </div>
    <div id="terrain-stats"></div>
    <div id="suspension-hud">
      <div class="susp-title">SUSPENSION</div>
      <div class="susp-grid">
        <div class="susp-wheel">
          <div class="susp-bar"><div class="susp-rest-line"></div><div class="susp-fill" id="susp-fl-fill"></div></div>
          <div class="susp-label">FL <span id="susp-fl-val">&mdash;</span></div>
        </div>
        <div class="susp-wheel">
          <div class="susp-bar"><div class="susp-rest-line"></div><div class="susp-fill" id="susp-fr-fill"></div></div>
          <div class="susp-label">FR <span id="susp-fr-val">&mdash;</span></div>
        </div>
        <div class="susp-wheel">
          <div class="susp-bar"><div class="susp-rest-line"></div><div class="susp-fill" id="susp-rl-fill"></div></div>
          <div class="susp-label">RL <span id="susp-rl-val">&mdash;</span></div>
        </div>
        <div class="susp-wheel">
          <div class="susp-bar"><div class="susp-rest-line"></div><div class="susp-fill" id="susp-rr-fill"></div></div>
          <div class="susp-label">RR <span id="susp-rr-val">&mdash;</span></div>
        </div>
      </div>
    </div>
    <div id="gauges">
      <div class="gauge" id="speedo">
        <div class="gauge-face"></div>
        <div class="gauge-needle" id="speedo-needle"></div>
        <div class="gauge-value" id="speedo-value">0</div>
        <div class="gauge-label">km/h</div>
      </div>
      <div class="gauge" id="compass">
        <div class="gauge-face compass-face" id="compass-dial">
          <span class="dir n">N</span>
          <span class="dir e">E</span>
          <span class="dir s">S</span>
          <span class="dir w">W</span>
        </div>
        <div class="compass-pointer"></div>
        <div class="gauge-value" id="compass-value" style="top: auto; bottom: 6px; transform: translateX(-50%); font-size: 12px;">
          N
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
