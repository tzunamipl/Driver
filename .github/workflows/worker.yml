name: Deploy leaderboard worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/lib/vehicles/legacyIds.js', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Uploaded as worker secrets from the env below.
          secrets: |
            SCENARIOS_TOKEN
          # The token needs D1 Edit on top of Workers Scripts Edit.
          command: |
            d1 migrations apply driver-leaderboard --remote
            deploy
        env:
          SCENARIOS_TOKEN: ${{ secrets.SCENARIOS_WRITE_TOKEN }}
